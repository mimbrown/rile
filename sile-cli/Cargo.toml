[package]
name = "sile-cli"
version = "0.1.0"
edition = "2024"

[features]
default = []
harfbuzz = ["sile-core/harfbuzz"]

[dependencies]
sile-core = { path = "../sile-core" }
sile-pages = { path = "../sile-pages" }
sile-pdf = { path = "../sile-pdf" }
sile-svg = { path = "../sile-svg" }
sile-markdown = { path = "../sile-markdown" }
fontdb = "0.22"
clap = { version = "4.6.7", features = ["derive"] }

[[bin]]
name = "sile"
path = "src/main.rs"
