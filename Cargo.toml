[workspace]
members = ["rile", "rile-cli", "rile-markdown", "rile-pages", "rile-pdf", "rile-svg", "sile-parity", "starter"]
exclude = ["vendor"]
resolver = "3"

[workspace.package]
repository = "https://github.com/mimbrown/rile"

# rile-pdf needs subset CFF fonts whose CIDs are the original glyph ids;
# see vendor/subsetter/Cargo.toml.
[patch.crates-io]
subsetter = { path = "vendor/subsetter" }
