[package]
name = "rile-pages"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["index"]
harfbuzz = ["rile/harfbuzz"]
# rile's `sile-quirks`, and one of this crate's own: after a footnote is
# split across pages, the next page's text frame is shrunk by more than the
# remainder takes (see `insertion.rs`).
sile-quirks = ["rile/sile-quirks"]
# Indexes sorted by locale (icu_collator).
index = ["dep:icu_collator", "dep:icu_locale"]

[dependencies]
rile = { path = "../rile", default-features = false }
cassowary = "0.3"
icu_collator = { version = "2.3.1", optional = true }
icu_locale = { version = "2.3.1", optional = true }
