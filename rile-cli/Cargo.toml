[package]
name = "rile-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The rile command: typesets Markdown to tagged PDF or SVG"
repository.workspace = true
readme = "../README.md"

[features]
default = []
harfbuzz = ["rile/harfbuzz"]

[dependencies]
rile = { version = "0.1.0", path = "../rile" }
rile-pages = { version = "0.1.0", path = "../rile-pages" }
rile-pdf = { version = "0.1.0", path = "../rile-pdf" }
rile-svg = { version = "0.1.0", path = "../rile-svg" }
rile-markdown = { version = "0.1.0", path = "../rile-markdown" }
fontdb = "0.22"
clap = { version = "4.6.7", features = ["derive"] }

[[bin]]
name = "rile"
path = "src/main.rs"
doc = false
