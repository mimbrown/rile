[package]
name = "rile"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["system-fonts", "math", "bibliography", "pdf-images"]
harfbuzz = ["dep:harfbuzz-sys"]
# Fonts installed on the system, found through fontconfig. Without it fonts
# come from files, directories, data or a FontSource.
system-fonts = ["fontdb/memmap", "fontdb/fontconfig"]
# Math: formulas from a typed tree, TeX-like syntax or MathML.
math = []
# Flaws of SILE's that printed work may depend on, for a port that has to
# come out as SILE set it. Off, rile does what SILE meant to:
# - a font's script is the tag as written, so `hebr` is not the script
#   `Hebr`, and its right-to-left text is shaped left to right and turned;
# - when a shaper gives a cluster's glyphs out of order, a break is found
#   too early in the word (a number under an Arabic year sign is split).
# - a paragraph whose text ends in a space keeps the space at the end of its
#   last line, where it shows when that line is set tight.
# - `looseness` does not choose a line count: it only passes over the first
#   pass, so the paragraph comes out as the final pass sets it.
sile-quirks = []
# PDF pages as images: reads a PDF to find its first page's size (lopdf).
pdf-images = ["dep:lopdf"]
# Citations and bibliographies from BibTeX through CSL styles (hayagriva).
bibliography = ["dep:hayagriva"]

[dependencies]
ttf-parser = "0.25"
fontdb = { version = "0.22", default-features = false, features = ["fs"] }
rustybuzz = "0.20"
self_cell = "1"
unicode-bidi = "0.3"
harfbuzz-sys = { version = "0.6", default-features = false, optional = true }
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13.3"
hayagriva = { version = "0.10.1", optional = true }
icu_segmenter = "2"
lopdf = { version = "0.45", default-features = false, optional = true }
