[package]
name = "rile-markdown"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Sets Markdown (CommonMark and GitHub's extensions, with math) with rile"
repository.workspace = true
readme = "../README.md"

[features]
default = ["pages", "math"]
harfbuzz = ["rile/harfbuzz"]
# Footnotes at the foot of the page and book headings with rile-pages.
pages = ["dep:rile-pages"]
# `$`/`$$` math; without it formulas are set as code.
math = ["rile/math"]

[dependencies]
rile = { version = "0.1.0", path = "../rile", default-features = false }
rile-pages = { version = "0.1.0", path = "../rile-pages", default-features = false, optional = true }
pulldown-cmark = { version = "0.13.4", default-features = false }
